[package]
name = "server2"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "server2"
path = "src/main.rs"

[dependencies]
pcre2 = "0.2.11"
pretty_assertions = "1.4.1"
rustc-hash = "2.1.1"
serde = "1.0.228"
serde_json = "1.0.147"
thiserror = "1"
tokio = {version = "1.48.0", features = ["full"] }
tower-lsp = "0.20.0"

[dev-dependencies]
rustfmt = "0.10.0"
tempfile = "3"
